name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml python-dotenv

      # Only the lightweight, model-free tests run in CI - they don't need
      # a GPU, a trained model, or the dataset. Training/evaluation are
      # run locally and documented in README.md instead.
      - name: Run tests
        run: pytest tests/test_config.py tests/test_detection_schemas.py tests/test_postprocess.py -v
